<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hospital SaaS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fe;
        }

        .sidebar {
            height: 100vh;
            background: #1e2a38;
            color: white;
            position: fixed;
            width: 220px;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: #cfd8dc;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #2f3e50;
            color: white;
        }

        .main {
            margin-left: 230px;
            padding: 20px;
        }

        .card-box {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .topbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-center mb-4">🏥 Hospital</h4>
        <a href="#">Dashboard</a>
        <a href="#">Doctors</a>
        <a href="#">Patients</a>
        <a href="#">Appointments</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Top Bar -->
        <div class="topbar d-flex justify-content-between">
            <h5>Dashboard</h5>
            <input type="text" class="form-control w-25" placeholder="Search...">
        </div>

        <!-- Cards -->
        <div class="row g-3">

            <div class="col-md-3">
                <div class="card card-box p-3">
                    <h6>Total Patients</h6>
                    <h3>1,245</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-box p-3">
                    <h6>Doctors</h6>
                    <h3>58</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-box p-3">
                    <h6>Appointments</h6>
                    <h3>320</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card card-box p-3 bg-danger text-white">
                    <h6>Emergency</h6>
                    <h3>5</h3>
                </div>
            </div>

        </div>

        <!-- Doctor Status -->
        <div class="card card-box mt-4 p-3">
            <h5>Doctor Status</h5>
            <p>🟢 Dr. Ahmed - Available</p>
            <p>🔴 Dr. Rahim - Busy</p>
            <p>🟢 Dr. Suma - Available</p>
        </div>

    </div>

</body>

</html>
